name: Documentation
on: [pull_request]
permissions: {contents: read}
jobs:
  links:
    if: ${{ github.repository == 'opencorex-org/openrevenue' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with: {args: "--no-progress './**/*.md'"}
