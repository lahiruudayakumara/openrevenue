name: Developer environment
on:
  pull_request:
    paths:
      - ".env.example"
      - ".node-version"
      - ".nvmrc"
      - ".tool-versions"
      - "Dockerfile"
      - "Makefile"
      - "docker-compose.yml"
      - "go.mod"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/dev/**"
      - ".github/workflows/developer-environment.yml"
  push:
    paths:
      - ".env.example"
      - ".node-version"
      - ".nvmrc"
      - ".tool-versions"
      - "Dockerfile"
      - "Makefile"
      - "docker-compose.yml"
      - "go.mod"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/dev/**"
      - ".github/workflows/developer-environment.yml"
permissions:
  contents: read
jobs:
  validate:
    if: ${{ github.repository == 'opencorex-org/openrevenue' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Validate shell scripts
        run: bash -n scripts/dev/*.sh
      - name: Validate pinned configuration and safe examples
        run: make validate-config
      - name: Validate Docker Compose model
        run: docker compose --env-file .env.example config --quiet
      - name: Demonstrate idempotent bootstrap
        run: |
          make bootstrap
          make bootstrap
