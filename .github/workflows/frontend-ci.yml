name: Frontend CI
on: [pull_request, push]
permissions: {contents: read}
jobs:
  verify:
    if: ${{ github.repository == 'opencorex-org/openrevenue' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Skip when the frontend workspace is not present
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "No root package.json found; frontend checks are not applicable to this revision."
      - uses: pnpm/action-setup@v4.4.0
        if: ${{ hashFiles('package.json') != '' }}
        with:
          version: 10.14.0
          run_install: false
      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@v6
        if: ${{ hashFiles('package.json') != '' && hashFiles('pnpm-lock.yaml') != '' }}
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Set up Node.js without dependency cache
        uses: actions/setup-node@v6
        if: ${{ hashFiles('package.json') != '' && hashFiles('pnpm-lock.yaml') == '' }}
        with:
          node-version: 22.23.1
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies from the lockfile
        if: ${{ hashFiles('package.json') != '' && hashFiles('pnpm-lock.yaml') != '' }}
        run: make web-install
      - name: Install dependencies without a lockfile
        if: ${{ hashFiles('package.json') != '' && hashFiles('pnpm-lock.yaml') == '' }}
        run: pnpm install --no-frozen-lockfile
      - if: ${{ hashFiles('package.json') != '' }}
        env:
          TURBO_TELEMETRY_DISABLED: "1"
        run: make web-format-check web-lint web-typecheck web-test web-build
