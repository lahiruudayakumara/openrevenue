name: Contracts CI
on: [pull_request, push]
permissions: {contents: read}
jobs:
  validate:
    if: ${{ github.repository == 'opencorex-org/openrevenue' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Skip when no contracts are present
        if: >-
          hashFiles('contracts/openapi/*.yaml', 'contracts/events/*.json') == ''
        run: echo "No API contracts found; contract checks are not applicable to this revision."
      - uses: stoplightio/spectral-action@latest
        if: ${{ hashFiles('contracts/openapi/*.yaml') != '' }}
        with:
          file_glob: contracts/openapi/*.yaml
          spectral_ruleset: .spectral.yaml
      - name: Validate event contract JSON
        if: ${{ hashFiles('contracts/events/*.json') != '' }}
        run: jq empty contracts/events/*.json
