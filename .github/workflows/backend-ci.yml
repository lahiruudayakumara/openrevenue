name: Backend CI
on: [pull_request, push]
permissions: {contents: read}
jobs:
  test:
    if: ${{ github.repository == 'opencorex-org/openrevenue' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Skip when the Go module is not present
        if: ${{ hashFiles('go.mod') == '' }}
        run: echo "No go.mod found; backend checks are not applicable to this revision."
      - uses: actions/setup-go@v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version: 1.26.5
          cache: true
      - if: ${{ hashFiles('go.mod') != '' }}
        run: make go-format-check go-lint go-test
