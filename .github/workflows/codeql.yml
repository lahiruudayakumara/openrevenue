name: CodeQL
on: [pull_request, push]
permissions: {contents: read, security-events: write}
jobs:
  analyze:
    if: ${{ github.repository == 'opencorex-org/openrevenue' }}
    runs-on: ubuntu-latest
    strategy: {matrix: {language: [go, javascript-typescript]}}
    steps:
      - uses: actions/checkout@v5
      - name: Skip when no matching source code is present
        if: >-
          (matrix.language == 'go' && hashFiles('**/*.go') == '') ||
          (matrix.language == 'javascript-typescript' &&
          hashFiles('**/*.js', '**/*.jsx', '**/*.mjs', '**/*.cjs',
          '**/*.ts', '**/*.tsx', '**/*.mts', '**/*.cts') == '')
        run: echo "No ${{ matrix.language }} source files found; analysis is not applicable to this revision."
      - uses: github/codeql-action/init@v4
        if: >-
          (matrix.language == 'go' && hashFiles('**/*.go') != '') ||
          (matrix.language == 'javascript-typescript' &&
          hashFiles('**/*.js', '**/*.jsx', '**/*.mjs', '**/*.cjs',
          '**/*.ts', '**/*.tsx', '**/*.mts', '**/*.cts') != '')
        with: {languages: "${{ matrix.language }}"}
      - uses: github/codeql-action/analyze@v4
        if: >-
          (matrix.language == 'go' && hashFiles('**/*.go') != '') ||
          (matrix.language == 'javascript-typescript' &&
          hashFiles('**/*.js', '**/*.jsx', '**/*.mjs', '**/*.cjs',
          '**/*.ts', '**/*.tsx', '**/*.mts', '**/*.cts') != '')
