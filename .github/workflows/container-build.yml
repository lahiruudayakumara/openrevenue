name: Container build
on: [pull_request, push]
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Skip when the container definition is not present
        if: ${{ hashFiles('Dockerfile') == '' }}
        run: echo "No root Dockerfile found; container checks are not applicable to this revision."
      - uses: docker/setup-buildx-action@v4
        if: ${{ hashFiles('Dockerfile') != '' }}
      - uses: docker/build-push-action@v7
        if: ${{ hashFiles('Dockerfile') != '' }}
        with:
          context: .
          push: false
          load: true
          tags: openrevenue/api:test
      - uses: aquasecurity/trivy-action@master
        if: ${{ hashFiles('Dockerfile') != '' }}
        with:
          image-ref: openrevenue/api:test
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
