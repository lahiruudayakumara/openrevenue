openapi: 3.1.0
info:
  title: OpenRevenue API
  version: 0.1.0
  description: Configurable revenue administration API
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: OpenRevenue maintainers
    url: https://github.com/opencorex-org/openrevenue
servers: [{ url: /api/v1 }]
security:
  - bearerAuth: []
tags:
  - { name: Taxpayers, description: Taxpayer identity and registration }
  - { name: Returns, description: Tax return lifecycle }
  - { name: Payments, description: Revenue payment processing }
  - { name: Ledger, description: Append-only taxpayer ledger }
  - { name: Audit, description: Administrative audit events }
paths:
  /taxpayers:
    parameters: &domainContext
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/JurisdictionCode" }
      - { $ref: "#/components/parameters/ActorId" }
      - { $ref: "#/components/parameters/ActorType" }
      - { $ref: "#/components/parameters/CorrelationId" }
      - { $ref: "#/components/parameters/CausationId" }
    post:
      operationId: createTaxpayer
      summary: Create a taxpayer
      description: Create a taxpayer record.
      tags: [Taxpayers]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreateTaxpayer" } },
            },
        }
      responses:
        {
          "201":
            {
              description: Created,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/Taxpayer" } },
                },
            },
          "401": { $ref: "#/components/responses/Unauthorized" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /taxpayers/{taxpayerId}:
    parameters: *domainContext
    get:
      operationId: getTaxpayer
      summary: Retrieve a taxpayer
      tags: [Taxpayers]
      parameters: [{ $ref: "#/components/parameters/TaxpayerId" }]
      responses:
        {
          "200":
            {
              description: Taxpayer state,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/Taxpayer" } },
                },
            },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "404": { $ref: "#/components/responses/Problem" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /taxpayers/{taxpayerId}/tax-registrations:
    parameters: *domainContext
    post:
      operationId: registerTaxpayer
      summary: Register a taxpayer for a tax type
      description: Submit a tax registration for a taxpayer.
      tags: [Taxpayers]
      parameters:
        [
          {
            name: taxpayerId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [taxType],
                      properties: { taxType: { type: string } },
                    },
                },
            },
        }
      responses:
        {
          "201":
            {
              description: Submitted,
              content:
                {
                  application/json:
                    {
                      schema: { $ref: "#/components/schemas/TaxRegistration" },
                    },
                },
            },
          "401": { $ref: "#/components/responses/Unauthorized" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /tax-registrations/{registrationId}:
    parameters: *domainContext
    get:
      operationId: getTaxRegistration
      summary: Retrieve a tax registration
      tags: [Taxpayers]
      parameters: [{ $ref: "#/components/parameters/RegistrationId" }]
      responses:
        {
          "200":
            {
              description: Registration state,
              content:
                {
                  application/json:
                    {
                      schema: { $ref: "#/components/schemas/TaxRegistration" },
                    },
                },
            },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "404": { $ref: "#/components/responses/Problem" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /tax-registrations/{registrationId}/approve:
    parameters: *domainContext
    post:
      operationId: approveTaxRegistration
      summary: Approve a submitted tax registration
      tags: [Taxpayers]
      parameters: [{ $ref: "#/components/parameters/RegistrationId" }]
      responses:
        {
          "200":
            {
              description: Approved,
              content:
                {
                  application/json:
                    {
                      schema: { $ref: "#/components/schemas/TaxRegistration" },
                    },
                },
            },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Problem" },
          "409": { $ref: "#/components/responses/Problem" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /returns:
    parameters: *domainContext
    post:
      operationId: createReturnDraft
      summary: Create a return draft
      description: Create a draft tax return.
      tags: [Returns]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReturnDraft" }
      responses:
        {
          "201":
            {
              description: Draft created,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/TaxReturn" } },
                },
            },
          "401": { $ref: "#/components/responses/Unauthorized" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /returns/{returnId}:
    parameters: *domainContext
    get:
      operationId: getReturn
      summary: Retrieve a return and its immutable version references
      tags: [Returns]
      parameters: [{ $ref: "#/components/parameters/ReturnId" }]
      responses:
        "200":
          description: Return state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxReturn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /returns/{returnId}/validate:
    parameters: *domainContext
    post:
      operationId: validateReturn
      summary: Validate a return draft
      description: Validate a draft return without submitting it.
      tags: [Returns]
      parameters: [{ $ref: "#/components/parameters/ReturnId" }]
      responses:
        {
          "200":
            {
              description: Stable field-level validation result,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/TaxReturn" } },
                },
            },
          "401": { $ref: "#/components/responses/Unauthorized" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /returns/{returnId}/calculate:
    parameters: *domainContext
    post:
      operationId: calculateReturn
      summary: Calculate a validated return deterministically
      tags: [Returns]
      parameters: [{ $ref: "#/components/parameters/ReturnId" }]
      responses:
        "200":
          description: Explainable calculation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxReturn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /returns/{returnId}/submit:
    parameters: *domainContext
    post:
      operationId: submitReturn
      summary: Submit a return
      description: Submit a validated return for assessment.
      tags: [Returns]
      parameters: [{ $ref: "#/components/parameters/ReturnId" }]
      responses:
        {
          "201": { description: Submitted and assessed },
          "401": { $ref: "#/components/responses/Unauthorized" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /returns/{returnId}/amend:
    parameters: *domainContext
    post:
      operationId: amendReturn
      summary: Create a new draft revision from a submitted return
      tags: [Returns]
      parameters: [{ $ref: "#/components/parameters/ReturnId" }]
      responses:
        "201":
          description: Amendment draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxReturn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /returns/{returnId}/history:
    parameters: *domainContext
    get:
      operationId: getReturnHistory
      summary: Retrieve all revisions without mutating the original
      tags: [Returns]
      parameters: [{ $ref: "#/components/parameters/ReturnId" }]
      responses:
        "200":
          description: Revision-ordered return history
          content:
            application/json:
              schema:
                type: object
                required: [returns]
                properties:
                  returns:
                    type: array
                    items: { $ref: "#/components/schemas/TaxReturn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /payments:
    parameters: *domainContext
    post:
      operationId: recordPayment
      summary: Record a payment
      description: Record and allocate a revenue payment.
      tags: [Payments]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordPayment" }
      responses:
        {
          "201":
            {
              description: Recorded and allocated,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/Payment" } },
                },
            },
          "401": { $ref: "#/components/responses/Unauthorized" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /payments/{paymentId}:
    parameters: *domainContext
    get:
      operationId: getPayment
      summary: Retrieve payment allocation state
      tags: [Payments]
      parameters: [{ $ref: "#/components/parameters/PaymentId" }]
      responses:
        "200":
          description: Payment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /payments/{paymentId}/allocations:
    parameters: *domainContext
    post:
      operationId: allocatePayment
      summary: Allocate available payment credit using optimistic concurrency
      tags: [Payments]
      parameters: [{ $ref: "#/components/parameters/PaymentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllocatePayment" }
      responses:
        "200":
          description: Updated payment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /assessments/{assessmentId}:
    parameters: *domainContext
    get:
      operationId: getAssessment
      summary: Retrieve an assessment and outstanding balance
      tags: [Payments]
      parameters: [{ $ref: "#/components/parameters/AssessmentId" }]
      responses:
        "200":
          description: Assessment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /taxpayers/{taxpayerId}/ledger:
    parameters: *domainContext
    get:
      operationId: getLedger
      summary: Get a taxpayer ledger
      description: Retrieve the taxpayer's append-only ledger.
      tags: [Ledger]
      parameters:
        [
          {
            name: taxpayerId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "200":
            {
              description: Balanced append-only ledger and projected balances,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/LedgerResponse" } },
                },
            },
          "401": { $ref: "#/components/responses/Unauthorized" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /ledger/postings/{postingId}/reverse:
    parameters: *domainContext
    post:
      operationId: reverseLedgerPosting
      summary: Append a balanced reversal for an existing posting
      tags: [Ledger]
      parameters: [{ $ref: "#/components/parameters/PostingId" }]
      responses:
        "201":
          description: Appended reversal posting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerPosting" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/audit-events:
    parameters: *domainContext
    get:
      operationId: listAuditEvents
      summary: List administrative audit events
      description: List immutable administrative audit events.
      tags: [Audit]
      responses:
        {
          "200": { description: Immutable audit events },
          "401": { $ref: "#/components/responses/Unauthorized" },
          default: { $ref: "#/components/responses/Problem" },
        }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      description: Canonical lowercase tenant isolation key.
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$" }
    JurisdictionCode:
      name: X-Jurisdiction-Code
      in: header
      required: true
      description: Canonical uppercase country or country-subdivision code.
      schema: { type: string, pattern: "^[A-Z]{2}(-[A-Z0-9]{1,3})?$" }
    ActorId:
      name: X-Actor-ID
      in: header
      required: true
      description: Opaque actor identifier derived from trusted identity claims.
      schema: { type: string, minLength: 1, maxLength: 128 }
    ActorType:
      name: X-Actor-Type
      in: header
      required: false
      description: Actor category; defaults to USER.
      schema: { type: string, enum: [USER, SERVICE, SYSTEM], default: USER }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Safe request correlation identifier generated when omitted.
      schema: { type: string, minLength: 1, maxLength: 128 }
    CausationId:
      name: X-Causation-ID
      in: header
      required: false
      description: Identifier of the command or event that caused this request; defaults to the correlation identifier.
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, maxLength: 128 },
      }
    TaxpayerId:
      {
        name: taxpayerId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    RegistrationId:
      {
        name: registrationId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    ReturnId:
      {
        name: returnId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    PaymentId:
      {
        name: paymentId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    AssessmentId:
      {
        name: assessmentId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    PostingId:
      {
        name: postingId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  schemas:
    ReturnLine:
      type: object
      required: [code, amountMinor]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" }
        amountMinor: { type: integer, format: int64 }
    CreateReturnDraft:
      type: object
      required:
        [taxpayerId, registrationId, periodId, formVersion, ruleVersion, lines]
      additionalProperties: false
      properties:
        taxpayerId: { type: string, format: uuid }
        registrationId: { type: string, format: uuid }
        periodId: { type: string }
        formVersion: { type: string }
        ruleVersion: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ReturnLine" }
    ValidationIssue:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code:
          type: string
          enum:
            [
              RETURN_NOT_DRAFT,
              FORM_VERSION_INCOMPATIBLE,
              FIELD_CODE_INVALID,
              AMOUNT_NEGATIVE,
              FIELD_NOT_IN_FORM,
              FIELD_DUPLICATE,
              FIELD_REQUIRED,
            ]
    ValidationResult:
      type: object
      required: [valid, formVersion, payloadHash, issues]
      properties:
        valid: { type: boolean }
        formVersion: { type: string }
        payloadHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/ValidationIssue" }
    CalculationStep:
      type: object
      required: [code, basisMinor, rateBasisPoints, resultMinor, rounding]
      properties:
        code: { type: string }
        basisMinor: { type: integer, format: int64 }
        rateBasisPoints: { type: integer, format: int64 }
        resultMinor: { type: integer, format: int64 }
        rounding: { type: string }
    CalculationResult:
      type: object
      required: [ruleVersion, inputHash, amount, steps, resultHash]
      properties:
        ruleVersion: { type: string }
        inputHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        amount: { $ref: "#/components/schemas/Money" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/CalculationStep" }
        resultHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    TaxReturn:
      type: object
      required:
        [
          id,
          tenantId,
          jurisdiction,
          taxpayerId,
          registrationId,
          periodId,
          formVersion,
          ruleVersion,
          lines,
          status,
          revision,
          originalReturnId,
        ]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        jurisdiction: { type: string }
        taxpayerId: { type: string, format: uuid }
        registrationId: { type: string, format: uuid }
        periodId: { type: string }
        formVersion: { type: string }
        ruleVersion: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ReturnLine" }
        status:
          { type: string, enum: [DRAFT, VALIDATED, CALCULATED, SUBMITTED] }
        revision: { type: integer, minimum: 1 }
        originalReturnId: { type: string, format: uuid }
        supersedesId: { type: string, format: uuid }
        validation: { $ref: "#/components/schemas/ValidationResult" }
        calculation: { $ref: "#/components/schemas/CalculationResult" }
        frozenPayloadHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        submittedAt: { type: string, format: date-time }
    CreateTaxpayer:
      {
        type: object,
        required: [name, identifier],
        additionalProperties: false,
        properties: { name: { type: string }, identifier: { type: string } },
      }
    Taxpayer:
      type: object
      required:
        [
          id,
          tenantId,
          jurisdiction,
          name,
          identifier,
          identifierScheme,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        jurisdiction: { type: string }
        name: { type: string }
        identifier: { type: string }
        identifierScheme: { type: string }
        createdAt: { type: string, format: date-time }
    TaxRegistration:
      type: object
      required:
        [id, tenantId, jurisdiction, taxpayerId, taxType, status, submittedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        jurisdiction: { type: string }
        taxpayerId: { type: string, format: uuid }
        taxType: { type: string }
        status: { type: string, enum: [SUBMITTED, APPROVED] }
        submittedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        approvedBy: { type: string }
    Money:
      type: object
      required: [minor, currency, minorUnits]
      properties:
        minor: { type: integer, format: int64 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        minorUnits: { type: integer, minimum: 0, maximum: 6 }
    RecordPayment:
      type: object
      required: [taxpayerId, amountMinor, currency]
      additionalProperties: false
      example:
        taxpayerId: 4c7c409b-a8b2-423e-b70b-5a31a23fcdb6
        assessmentId: 2c033fef-981d-4d2b-a72f-a41c1df39f62
        amountMinor: 12500
        currency: LKR
      properties:
        taxpayerId: { type: string, format: uuid }
        assessmentId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    AllocatePayment:
      type: object
      required: [assessmentId, amountMinor, currency, expectedVersion]
      additionalProperties: false
      properties:
        assessmentId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
    Allocation:
      type: object
      required:
        [assessmentId, amount, postingId, allocatedAt, actorId, correlationId]
      properties:
        assessmentId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        postingId: { type: string, format: uuid }
        allocatedAt: { type: string, format: date-time }
        actorId: { type: string }
        correlationId: { type: string }
    Payment:
      type: object
      required:
        [
          id,
          tenantId,
          jurisdiction,
          taxpayerId,
          amount,
          allocated,
          unapplied,
          status,
          version,
          receiptPostingId,
          allocations,
        ]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        jurisdiction: { type: string }
        taxpayerId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        allocated: { $ref: "#/components/schemas/Money" }
        unapplied: { $ref: "#/components/schemas/Money" }
        status:
          { type: string, enum: [UNAPPLIED, PARTIALLY_ALLOCATED, ALLOCATED] }
        version: { type: integer, format: int64, minimum: 1 }
        receiptPostingId: { type: string, format: uuid }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/Allocation" }
    Assessment:
      type: object
      required:
        [id, tenantId, jurisdiction, returnId, amount, outstanding, postingId]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        jurisdiction: { type: string }
        returnId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        outstanding: { $ref: "#/components/schemas/Money" }
        postingId: { type: string, format: uuid }
    LedgerEntry:
      type: object
      required:
        [
          id,
          postingId,
          tenantId,
          jurisdiction,
          taxpayerId,
          entryType,
          account,
          debitAmount,
          creditAmount,
          referenceType,
          referenceId,
          effectiveDate,
          postedAt,
          createdBy,
          correlationId,
          causationId,
        ]
      properties:
        id: { type: string, format: uuid }
        postingId: { type: string, format: uuid }
        tenantId: { type: string }
        jurisdiction: { type: string }
        taxpayerId: { type: string, format: uuid }
        entryType: { type: string }
        account: { type: string }
        debitAmount: { $ref: "#/components/schemas/Money" }
        creditAmount: { $ref: "#/components/schemas/Money" }
        referenceType: { type: string }
        referenceId: { type: string }
        effectiveDate: { type: string, format: date-time }
        postedAt: { type: string, format: date-time }
        createdBy: { type: string }
        correlationId: { type: string }
        causationId: { type: string }
        reversalOf: { type: string, format: uuid }
    LedgerPosting:
      type: object
      required:
        [
          id,
          tenantId,
          jurisdiction,
          referenceType,
          referenceId,
          entries,
          postedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        jurisdiction: { type: string }
        referenceType: { type: string }
        referenceId: { type: string }
        entries:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/LedgerEntry" }
        postedAt: { type: string, format: date-time }
        reversalOf: { type: string, format: uuid }
    LedgerBalance:
      type: object
      required: [currency, receivableMinor, unappliedMinor, netDueMinor]
      properties:
        currency: { type: string }
        receivableMinor: { type: integer, format: int64 }
        unappliedMinor: { type: integer, format: int64 }
        netDueMinor: { type: integer, format: int64 }
    LedgerResponse:
      type: object
      required: [entries, balance, asOf]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
        balance: { $ref: "#/components/schemas/LedgerBalance" }
        asOf: { type: string, format: date-time }
    Problem:
      {
        type: object,
        required: [type, title, status],
        properties:
          {
            type: { type: string, format: uri-reference },
            title: { type: string },
            status: { type: integer },
            detail: { type: string },
            instance: { type: string },
          },
        example:
          {
            type: "about:blank",
            title: "Invalid request",
            status: 400,
            detail: "The request body did not satisfy the contract.",
            instance: "/api/v1/payments",
          },
      }
  responses:
    Unauthorized:
      description: Authentication is required or the bearer token is invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem:
      {
        description: RFC 9457 problem details,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
